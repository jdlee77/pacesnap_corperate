<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE Snap Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one scrolling page. Sticky verdict bar, tier picker, then numbered sections that build on each other (functions, kit, plan, drills, ready). */
:root{
  --bg:#E9EEEE; --panel:#FFFFFF; --panel-2:#F3F6F6; --ink:#12212A; --muted:#55666E; --line:#C8D2D4;
  --accent:#0E6A82; --accent-ink:#FFFFFF;
  --lvl-p:#3C8C3E; --lvl-a:#D9B400; --lvl-c:#E07A1F; --lvl-e:#C73B3B; --on-lvl:#10181C;
  --good:#2F7D3A; --warn:#A86500; --bad:#B42E2E; --warn-bg:#FFF4DD; --bad-bg:#FCE8E6; --good-bg:#E5F3E6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1417; --panel:#142027; --panel-2:#1A2830; --ink:#E2EAEC; --muted:#8FA1A7; --line:#2A3B43;
  --accent:#4BB4CE; --accent-ink:#06171C;
  --lvl-p:#5BB95E; --lvl-a:#E3C53A; --lvl-c:#F0913D; --lvl-e:#E35F5C;
  --good:#6CC27A; --warn:#E8A94A; --bad:#F07872; --warn-bg:#2E2513; --bad-bg:#33191A; --good-bg:#17301D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1417; --panel:#142027; --panel-2:#1A2830; --ink:#E2EAEC; --muted:#8FA1A7; --line:#2A3B43;
  --accent:#4BB4CE; --accent-ink:#06171C;
  --lvl-p:#5BB95E; --lvl-a:#E3C53A; --lvl-c:#F0913D; --lvl-e:#E35F5C;
  --good:#6CC27A; --warn:#E8A94A; --bad:#F07872; --warn-bg:#2E2513; --bad-bg:#33191A; --good-bg:#17301D;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,44px);text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
h2 .n{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.05em}
h3{font-size:19px;letter-spacing:.02em}
p{margin:0;max-width:65ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}

.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{padding-block:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .st{display:inline-flex;gap:2px;align-items:flex-end}
.brand .st i{display:block;width:5px;border-radius:1px}
.brand .tn{color:var(--accent)}
.verdict{display:flex;align-items:center;gap:12px;min-width:0}
.vtag{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding:2px 10px;border-radius:5px;white-space:nowrap}
.vtag.ok{background:var(--good-bg);color:var(--good)}
.vtag.gap{background:var(--warn-bg);color:var(--warn)}
.vtag.none{background:var(--panel-2);color:var(--muted)}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:3px;background:var(--bad-bg);border:1px solid var(--bad)}
.pip.ok{background:var(--good);border-color:var(--good)}
.vmeta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.bar .wrap{grid-template-columns:1fr auto}.brand{display:none}.vmeta{display:none}.pip{width:10px;height:10px}.vtag{font-size:17px}}

main .wrap{padding-block:22px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.chip{display:inline-flex;font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.path{border-color:var(--accent);color:var(--accent)}
.lvl{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--on-lvl);flex:0 0 auto}
.lvl.p{background:var(--lvl-p)}.lvl.a{background:var(--lvl-a)}.lvl.c{background:var(--lvl-c)}.lvl.e{background:var(--lvl-e)}
.lvl.sm{width:22px;height:22px;font-size:14px;border-radius:4px}
.flag{font-size:13px;padding:7px 10px;border-radius:6px}
.flag.bad{background:var(--bad-bg);color:var(--bad)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.good{background:var(--good-bg);color:var(--good)}
.tip{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel-2);font-size:13.5px;color:var(--muted);border-radius:0 6px 6px 0}
.tip b{color:var(--ink)}

/* tier picker */
.tiers{display:flex;gap:6px;flex-wrap:wrap}
.tiers button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.tiers button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiers button:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.tiers button small{display:block;font-family:var(--f-mono);font-weight:500;font-size:9.5px;letter-spacing:.08em;color:var(--muted)}
.tiers button[aria-selected="true"] small{color:inherit;opacity:.7}

/* functions */
.fnlist{display:flex;flex-direction:column;gap:8px}
.fnrow{display:grid;grid-template-columns:auto minmax(160px,1.6fr) 120px auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.fnrow.off{opacity:.55}
.fnrow.x2{grid-template-columns:auto minmax(160px,1.6fr) 120px 96px minmax(110px,.8fr) auto}
@media (max-width:760px){.fnrow,.fnrow.x2{grid-template-columns:auto 1fr}.fnrow>*:nth-child(n+3){grid-column:2}}
.fnadd{display:flex;gap:8px;flex-wrap:wrap}
.fnadd input[type=text]{flex:1 1 220px;width:auto}
.fnadd select{width:auto}

/* kit */
.inv-group{display:flex;flex-direction:column;gap:8px}
.inv-group h3{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.asset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel-2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.asset[aria-pressed="true"]{border-color:var(--accent);background:var(--panel);box-shadow:inset 0 0 0 1px var(--accent)}
.asset .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.asset .nm .ck{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap}
.asset .nt{font-size:12.5px;color:var(--muted)}
.asset .tags{display:flex;flex-wrap:wrap;gap:4px}
.example{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.kitsum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px}

/* plan */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;text-align:left}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}
.autobar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px}
.autobar.auto{border-color:var(--accent)}
.rungs{display:flex;flex-direction:column;gap:10px}
.rung{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.rung .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.rung .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rung .hd b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.rung .hd span{font-size:12.5px;color:var(--muted)}
.rung .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rung.clash{border-color:var(--bad)}
.rung.empty{border-style:dashed}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px}
.pcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel)}
.pcrow .lb{font-size:12.5px;line-height:1.2}
.pcrow .lb small{display:block;color:var(--muted);font-size:11px}
.pcrow.wt{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:3px 9px;cursor:pointer;font-family:var(--f-mono);font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.why{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.why summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.why ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.why li:first-child{color:var(--ink);font-weight:500}
.altrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.altrow>b{align-self:center;overflow-wrap:anywhere}
.alts{margin:0;padding-left:18px}
@media(max-width:700px){.altrow{grid-template-columns:1fr}}
.astw{display:flex;flex-direction:column;gap:4px;min-width:0}.astw .asset{flex:1}
.addit summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.addit[open]{display:flex;flex-direction:column;gap:10px}
.mon{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.mon.sugg{border-style:dashed}
.monhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evs{display:flex;flex-wrap:wrap;gap:4px}
.ev{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.ev[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trig{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;margin-left:20px}
.trig .arrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* crosswalk */
table.xwm th,table.xwm td{text-align:center;padding:4px}
table.xwm td:first-child,table.xwm th:first-child{text-align:left;min-width:150px}
table.xwm td.self{color:var(--muted)}
.dep{width:100%;min-width:60px;border:1px solid var(--line);border-radius:4px;padding:4px 2px;font-size:11.5px;background:var(--panel-2);color:var(--muted);cursor:pointer}
.dep.lv1{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.dep.lv2{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);font-weight:600}
.chip.okc{border-color:var(--good);color:var(--good)}.chip.noc{border-color:var(--bad);color:var(--bad);white-space:normal}

/* public safety sheet */
.locrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:760px){.locrow{grid-template-columns:1fr}}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
td.res{text-align:center;white-space:nowrap}
.x{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:13px}
tr.hz td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.sc-name{font-weight:600}.sc-brief{font-size:12px;color:var(--muted)}
table.mx td{min-width:130px}
.mxc.lp{box-shadow:inset 3px 0 0 var(--lvl-p)}.mxc.la{box-shadow:inset 3px 0 0 var(--lvl-a)}.mxc.lc{box-shadow:inset 3px 0 0 var(--lvl-c)}.mxc.le{box-shadow:inset 3px 0 0 var(--lvl-e)}
table.mx td:first-child{min-width:170px}

/* ready */
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.gate{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.gate .st{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;flex:0 0 auto}
.gate .st.ok{background:var(--good-bg);color:var(--good)}
.gate .st.no{background:var(--bad-bg);color:var(--bad)}
.gate b{display:block;font-size:14px}
.gate small{color:var(--muted);font-size:12.5px;display:block}
.gate .miss{color:var(--bad);font-size:12.5px;margin-top:2px}
.ready{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px;border-radius:10px;border:2px solid var(--line)}
.ready.yes{border-color:var(--good);background:var(--good-bg)}
.ready.no{border-color:var(--warn);background:var(--warn-bg)}
.big{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,14,18,.62);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.mcard{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mcard h2{margin:0}
.mcard p{margin:0}
.mcard ul,.mcard ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mstep{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent)}
.mcard.wz{width:min(780px,100%);max-height:100%;overflow:hidden;padding:0;gap:0}
.wzh0{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.wzp{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.wzp i{display:block;height:100%;background:var(--accent)}
.wzb{padding:16px 22px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.wzf{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wztip{border-left:3px solid var(--accent);background:var(--panel-2);padding:8px 12px;border-radius:4px;font-size:13.5px}
.wzcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2);min-width:0}
.wzcard.sugg{border-style:dashed}
.wzlist{display:flex;flex-direction:column;gap:6px}
.wzchk{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.wzmeter{padding:8px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:13.5px}.wzmeter.ok{border-color:var(--accent)}
.wzh{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wz4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13px}.wz4>div{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}.wz4 b{display:block}
.wzrate{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,64px);gap:6px;align-items:center;font-size:13px}.wzrate.hd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}.wzrate.hd span{text-align:center}
.wzrate .nm{overflow-wrap:anywhere}
.wzlad{display:flex;flex-direction:column;gap:8px}
@media(max-width:520px){.wzrate{grid-template-columns:minmax(0,1fr) repeat(4,50px);gap:4px}.wzrate.hd{font-size:9px}}
.wzrate select{padding:6px 2px;text-align:center;text-align-last:center}
.lad{display:grid;gap:6px}
.lad div{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.lad .lvl{flex:none}
.pickt{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function monDefault(a){const o=MONOVR[a.id];if(o)return{m:o.m,t:o.t||[],rd:'15 minutes',sched:''};return (a.bw??3)<=1?{m:'always',t:[],rd:'',sched:''}:{m:'trig',t:[...DEFT],rd:'15 minutes',sched:''}}
function monEff(f,id){const sv=(S.mon[f]||{})[id];return{...monDefault(asset(id)),...(sv||{}),confirmed:!!sv}}
function monSet(f,id){S.mon[f]=S.mon[f]||{};return S.mon[f][id]=S.mon[f][id]||{}}
function monShort(m){if(!m)return'';if(m.m==='always')return'Monitored 24/7';if(m.m==='hours')return'Business hours only';if(m.m==='sched')return'Scheduled: '+(m.sched||'(add schedule)');return'When: '+((m.t||[]).map(e=>EVN[e]).join(', ')||'(add a trigger)')+(m.rd?' | ready in '+m.rd:'')}

function isMon(R,sc,upper){const m=R.mon;if(!m||m.m==='always')return true;if(m.m==='hours'||m.m==='sched')return !OFF.has(sc.id);
 return (m.t||[]).some(e=>e==='nocontact'?upper:e==='cyber'?sc.hz==='cyber':e==='bcp')}

function drillRungs(L,sc,assume){const fails=[];
 for(let i=0;i<L.length;i++){const R=L[i],A=R.a?asset(R.a):null;if(!A){fails.push({i,why:'empty rung'});continue}
  const kp=A.path.filter(p=>sc.kp.includes(p)),kc=(A.cond||[]).filter(c=>sc.kc.includes(c));

function rationale(ids,i,f){const R=rungsOf(ids,f),A=asset(ids[i]),out=[];
 out.push(['Primary: your everyday path, the highest-throughput, easiest option for this function.','Alternate: the first fallback, on a different network than Primary.','Contingency: a strategic fallback that survives what takes out the rungs above it.','Emergency: the most self-reliant path left for this function.'][i]);

 if(i===0){const br=SCEN.filter(s=>{const d=drillRungs(R,s);return !(d.ok&&d.lvl===0)}).map(s=>s.name);
  out.push(br.length?`Holds in ${SCEN.length-br.length} of ${SCEN.length} drills. Breaks in: ${br.join(', ')}. That is what the lower rungs are for.`:'Holds in every drill on its own.')}

 if(A.via)out.push('Delivered over any working phone network, so it fails only when all of them are down at once.');

function gapAdvice(ids,type,f){const R=rungsOf(ids,f);const lost=SCEN.filter(s=>!drillRungs(R,s).ok);if(!lost.length)return null;

 const norto=T().fnx?Fs.filter(f=>!(f.rto||'').trim()).length:0;

 const monBad=need(r=>{const m=r.mon;return m.confirmed&&(m.m==='always'||m.m==='hours'||(m.m==='trig'&&(m.t||[]).length>0&&(m.rd||'').trim())||(m.m==='sched'&&(m.sched||'').trim()))});
 const cm=[];if(!full)cm.push('Fill every rung');else{if(nocon)cm.push(`${nocon} contact${nocon===1?'':'s'} missing`);if(noown)cm.push(`${noown} owner${noown===1?'':'s'} missing`);if(norto)cm.push(`${norto} RTO${norto===1?'':'s'} missing`);if(noro)cm.push(`${noro} reach-out point${noro===1?'':'s'} missing`)}
 const out=[
 {k:'Feasible',ok:full&&weak===0,d:'Every rung is filled and rated Availability 2+ and Ease 2+.',miss:!full?`${emptyRungs} empty rung${emptyRungs===1?'':'s'}`:weak?`${weak} rung${weak===1?'':'s'} rated 1 on Availability or Ease`:''},

 {k:'Suitable',ok:S.attest.suit&&full&&nomode===0,d:T().gd.suit,att:'suit',miss:!S.attest.suit?'Confirm below':nomode?`${nomode} mode${nomode===1?'':'s'} blank`:'Fill every rung'},

const depOf=(a,b)=>{const v=((S.xw||{}).dep||{})[a+'>'+b];return v!==undefined?v:(SEC[a].dep.includes(b)?2:0)};
function xwFindings(){const P=xwOn(),ids=new Set(P.map(s=>s.id));

 const miss=new Map();P.forEach(p=>p.dep.forEach(d=>{if(ids.has(d))return;if(!miss.has(d))miss.set(d,[]);miss.get(d).push(p)}));
 const noLiaison=P.filter(p=>{const x=S.xw.sec[p.id]||{};return !(x.org||'').trim()||!(x.contact||'').trim()});
 return{P,hubs,miss:[...miss.entries()].map(([d,by])=>({s:SEC[d],by})),noLiaison}}

 delAsset:d=>{S.custom=S.custom.filter(a=>a.id!==d.id);delete S.inv[d.id];S.alts=(S.alts||[]).filter(x=>x.id!==d.id);Object.keys(S.manual).forEach(f=>{if(JSON.stringify(S.manual[f]).includes(d.id))delete S.manual[f]});render();toast('Item removed')},
 fnToggle:d=>{S.fns[+d.idx].on=!S.fns[+d.idx].on;render()},
 fnDel:d=>{const f=S.fns[+d.idx];S.fns.splice(+d.idx,1);delete S.manual[f.id];render()},
 addFn:()=>{const n=$('newfn').value.trim();if(!n)return toast('Name the function first');const id='f'+Date.now();
  S.fns.push({id,name:n,type:$('newtype').value,on:true,custom:true,...(T().fnx?{pri:2,rto:'4 hours'}:{})});render();toast('Function added')},
 tab:d=>{S.tab=d.id;render()},
 rsEdit:()=>{const f=psFn();if(!f)return;S.tab=f.id;render();$('plan').querySelector('section').scrollIntoView({behavior:'smooth'})},
 rsCap:d=>{const R=rsData();R.caps=R.caps.includes(d.id)?R.caps.filter(c=>c!==d.id):[...R.caps,d.id];render()},
 rsLocAdd:()=>{rsData().locs.push({name:'',addr:'',contact:'',notes:''});render()},
 rsLocDel:d=>{rsData().locs.splice(+d.idx,1);render()},
 rsPdf:(d,el)=>exportRSPDF(el),
 rsVcf:()=>{dl(`Public-Safety-Contacts-${slug(rsWho())}.vcf`,buildVCF(),'text/vcard;charset=utf-8');toast(rsView().ok?'Contacts file downloaded. Share it only with public safety.':'Draft contacts downloaded. Fix the open items before sharing.')},
 rsCsv:()=>{dl(`Public-Safety-Contacts-${slug(rsWho())}-${new Date().toISOString().slice(0,10)}.csv`,buildRSCSV(),'text/csv;charset=utf-8');toast('CSV downloaded. It contains non-public numbers.')},
 xwSec:d=>{const x=xwSec(d.id);x.on=!x.on;render()},
 xwDep:d=>{const v=(depOf(d.a,d.b)+1)%3;S.xw.dep[d.a+'>'+d.b]=v;render()},
 secFn:()=>{const s=SEC[S.sector];if(!s)return;S.fns.push({id:'f'+Date.now(),name:s.fn,type:'any',on:true,custom:true,pri:1,rto:'4 hours',ro:''});render();toast('Function added')},
 rate:d=>{const a=asset(d.id);const r=[...effR(a)];r[+d.k]=+d.v;S.rate[d.id]=r;render()},
 resetAuto:()=>{delete S.manual[curTab()];render();toast('Back to the auto-built ladder')},
 attest:d=>{S.attest[d.k]=!S.attest[d.k];save();light()},
 pdf:(d,el)=>exportPDF(el,'shared'),
 pdfFull:(d,el)=>exportPDF(el,'full'),
 altAdd:()=>{const v=$('altpick').value;if(!v)return toast('Choose a method first');S.alts=S.alts||[];S.alts.push({id:v,contact:'',note:''});render()},
 altDel:d=>{S.alts.splice(+d.idx,1);render()},
 monOk:d=>{monSet(d.f,d.id);render()},
 monTrig:d=>{const o=monSet(d.f,d.id);const df=monDefault(asset(d.id));const cur=o.t||[...df.t];o.t=cur.includes(d.e)?cur.filter(x=>x!==d.e):[...cur,d.e];o.m='trig';if(o.rd===undefined)o.rd=df.rd||'15 minutes';render()},
 copy:()=>{const ta=$('out');try{navigator.clipboard.writeText(ta.value).then(()=>toast('Plan copied'),()=>{ta.select();toast('Selected. Press Ctrl/Cmd+C')})}catch(e){ta.select();toast('Selected. Press Ctrl/Cmd+C')}},
 clearSample:()=>{S=fresh();SAMPLEARM=false;render();window.scrollTo({top:0});toast('Sample cleared. Your plan is empty.')},
 reset:()=>{if(!RESETARM){RESETARM=true;render();clearTimeout(ACT.rh);ACT.rh=setTimeout(()=>{RESETARM=false;render()},5000);return}RESETARM=false;S=fresh();render();window.scrollTo({top:0});toast('Plan cleared')}};
const CHG={
 
 swap:t=>{const f=curTab();const ids=[...ladderIds(f)];ids[+t.dataset.i]=t.value;S.manual[f]=ids;render()},
 mon:t=>{const o=monSet(curTab(),t.dataset.id);const df=monDefault(asset(t.dataset.id));o.m=t.value;if(o.m==='trig'){o.t=o.t||[...(df.t.length?df.t:DEFT)];if(o.rd===undefined)o.rd='15 minutes'}render()},
 cad:t=>{const f=curTab();(S.cad[f]=S.cad[f]||{})[t.dataset.id]=t.value;save();light()},
 fntype:t=>{const f=S.fns[+t.dataset.idx];f.type=t.value;delete S.manual[f.id];render()},
 fnpri:t=>{S.fns[+t.dataset.idx].pri=+t.value;render()},
 sector:t=>{S.sector=t.value;render()}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.type!=='checkbox')e.preventDefault();ACT[a.dataset.act](a.dataset,a)}});
document.addEventListener('input',e=>{const t=e.target,b=t.dataset.bind;if(!b)return;const k=b.split('.');let o=S;for(let i=0;i<k.length-1;i++){o[k[i]]=o[k[i]]||{};o=o[k[i]]}o[k[k.length-1]]=t.value;save();light()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.chg)CHG[t.dataset.chg](t);else if(t.dataset.rer)render()});
document.addEventListener('keydown',e=>{if($('onb').hidden)return;if(e.key==='Escape')onbClose();else if(e.key==='Tab'){const f=[...$('onbC').querySelectorAll('button,input,select')];if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1)){e.preventDefault();f[0].focus()}}});
$('onb').addEventListener('click',e=>{if(e.target===$('onb'))onbClose()});
$('onbC').addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.w)wzIn(t,t.dataset.w,'input')});
$('onbC').addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.w)wzIn(t,t.dataset.w,'change')});
$('loadfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>5e6)return toast('That file is too large');const r=new FileReader();r.onload=()=>loadFromText(String(r.result));r.onerror=()=>toast('Could not read that file');r.readAsText(f)});
loadState();render();
let seen=false;try{seen=!!localStorage.getItem('pace-biz-onb')}catch(e){}if(!seen)onbOpen();
</script>
</body>
